[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lander"
version = "0.1.0"
description = "Reward shaping and reward hacking with PPO on LunarLander-v3"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lander = ["dashboard_template.html"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Box2D's SWIG bindings warn on import under Python 3.12; not our code.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
